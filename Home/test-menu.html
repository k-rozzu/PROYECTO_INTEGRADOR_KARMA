<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba aislada — Menú de perfil</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #e8e8e8;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 60px;
    }
    h1 { margin-bottom: 30px; color: #333; font-size: 18px; }

    .profile-dropdown-container {
        position: relative;
        display: flex;
        align-items: center;
    }

    .profile-icon-container {
        width: 44px; height: 44px; flex-shrink: 0;
        display: flex; justify-content: center; align-items: center;
        border-radius: 50%;
        background: #1a1a1a;
        border: 1px solid #333;
        padding: 0;
        cursor: pointer;
        transition: 0.3s ease;
    }
    .profile-icon-container:hover { background: #2a2a2a; }
    .profile-icon { width: 20px; height: 20px; }

    .profile-menu {
        display: flex;
        flex-direction: column;
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        width: 220px;
        background-color: #0D1117;
        border-radius: 12px;
        box-shadow: 0 12px 28px rgba(0,0,0,0.5);
        z-index: 2000;
        border: 1px solid #30363d;
        padding: 6px;
        gap: 2px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-6px);
        transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
    }
    .profile-dropdown-container.open .profile-menu {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }

    .profile-menu .value {
        background-color: transparent;
        border: none;
        padding: 12px 14px;
        color: #ffffff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        border-radius: 8px;
        position: relative;
        transition: background-color 0.2s;
    }
    .profile-menu .value:hover { background-color: #21262C; }
    .profile-menu .value svg { width: 18px; height: 18px; flex-shrink: 0; }

    #estado {
        margin-top: 40px;
        font-family: monospace;
        font-size: 13px;
        background: #fff;
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid #ccc;
        color: #111;
        max-width: 400px;
        text-align: center;
    }
</style>
</head>
<body>

    <h1>Prueba aislada del menú de perfil (sin fetch, sin componentes)</h1>

    <div class="profile-dropdown-container" id="profileDropdown">
        <button type="button" class="profile-icon-container" id="profileTrigger" onclick="toggleProfileMenu()" aria-haspopup="true" aria-expanded="false">
            <svg class="profile-icon" viewBox="0 0 24 24" fill="white">
                <circle cx="12" cy="7" r="4" />
                <path d="M12 14c-4.41 0-8 3.59-8 8h16c0-4.41-3.59-8-8-8z" />
            </svg>
        </button>

        <div class="profile-menu" id="profileMenu" role="menu">
            <button class="value" role="menuitem" onclick="alert('Ir a perfil.html')">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path d="m1.5 13v1a.5.5 0 0 0 .3379.4731 18.9718 18.9718 0 0 0 6.1621 1.0269 18.9629 18.9629 0 0 0 6.1621-1.0269.5.5 0 0 0 .3379-.4731v-1a6.5083 6.5083 0 0 0 -4.461-6.1676 3.5 3.5 0 1 0 -4.078 0 6.5083 6.5083 0 0 0 -4.461 6.1676zm4-9a2.5 2.5 0 1 1 2.5 2.5 2.5026 2.5026 0 0 1 -2.5-2.5zm2.5 3.5a5.5066 5.5066 0 0 1 5.5 5.5v.6392a18.08 18.08 0 0 1 -11 0v-.6392a5.5066 5.5066 0 0 1 5.5-5.5z" fill="#7D8590"></path></svg>
                Alejandro Vazquez
            </button>
            <button class="value" role="menuitem" onclick="alert('Cerrar sesión')">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 25" fill="none"><path fill-rule="evenodd" fill="#7D8590" d="m11.9572 4.31201c-3.35401 0-6.00906 2.59741-6.00906 5.67742v3.29037c0 .1986-.05916.3927-.16992.5576l-1.62529 2.4193-.01077.0157c-.18701.2673-.16653.5113-.07001.6868.10031.1825.31959.3528.67282.3528h14.52603c.2546 0 .5013-.1515.6391-.3968.1315-.2343.1117-.4475-.0118-.6093-.0065-.0085-.0129-.0171-.0191-.0258l-1.7269-2.4194c-.121-.1695-.186-.3726-.186-.5809v-3.29037c0-1.54561-.6851-3.023-1.7072-4.00431-1.1617-1.01594-2.6545-1.67311-4.3019-1.67311zm-8.00906 5.67742c0-4.27483 3.64294-7.67742 8.00906-7.67742 2.2055 0 4.1606.88547 5.6378 2.18455.01.00877.0198.01774.0294.02691 1.408 1.34136 2.3419 3.34131 2.3419 5.46596v2.97007l1.5325 2.1471c.6775.8999.6054 1.9859.1552 2.7877-.4464.795-1.3171 1.4177-2.383 1.4177h-14.52603c-2.16218 0-3.55087-2.302-2.24739-4.1777l1.45056-2.1593zm4.05187 11.32257c0-.5523.44772-1 1-1h5.99999c.5523 0 1 .4477 1 1s-.4477 1-1 1h-5.99999c-.55228 0-1-.4477-1-1z" clip-rule="evenodd"></path></svg>
                Cerrar Sesión
            </button>
        </div>
    </div>

    <div id="estado">Esperando clic...</div>

<script>
    const estado = document.getElementById('estado');

    function toggleProfileMenu() {
        const container = document.getElementById('profileDropdown');
        const trigger = document.getElementById('profileTrigger');
        const isOpen = container.classList.toggle('open');
        trigger.setAttribute('aria-expanded', String(isOpen));
        estado.textContent = 'Clic detectado. Menú ' + (isOpen ? 'ABIERTO' : 'CERRADO');
    }

    window.addEventListener('click', function (event) {
        if (!event.target.closest('.profile-dropdown-container')) {
            const container = document.getElementById('profileDropdown');
            container.classList.remove('open');
        }
    });
</script>
</body>
</html>
