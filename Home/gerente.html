<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARMA · Punto de Venta — Panel Gerente</title>
<!-- Tipografías-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../CSS/dashboard/gerente-style.css">
<!-- Chart.js — gráficas del panel de gerente -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>
<!-- Aplica el tema guardado antes de dibujar la página (evita un destello claro) -->
<script>try { if (localStorage.getItem("karma_tema") === "dark") document.body.classList.add("dark"); } catch (_) {}</script>

<div class="app">

  <!-- BARRA SUPERIOR: logo (clic = ir a Dashboard), idioma, tema, nombre de sede y cerrar sesión -->
  <header class="topbar">

    <!-- Fila superior: marca + acciones de cuenta -->
    <div class="topbar-main">

      <!-- Logo: al hacer clic regresa al Dashboard del gerente -->
      <button class="brand" id="logoHome" type="button" title="Ir al Dashboard" data-i18n-title="topHome">
        <img class="brand-logo" src="../assets/logo-karma.png" alt="" aria-hidden="true">
        <div class="brand-text">
          <span class="brand-name">KARMA</span>
          <span class="brand-slogan" data-i18n="brandSlogan">Panel de Gerencia</span>
        </div>
      </button>

      <!-- Controles de cuenta / sesión -->
      <div class="topbar-right">
        <button class="lang-toggle" id="langToggle" title="Cambiar idioma" aria-label="Cambiar idioma">
          <span class="lang-op is-active" data-lang="es">ES</span>
          <span class="lang-sep">/</span>
          <span class="lang-op" data-lang="en">EN</span>
        </button>
        <button class="theme-toggle" id="themeToggle" title="Cambiar modo" aria-label="Cambiar modo claro/oscuro">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/></svg>
        </button>
        <button class="logout-btn" id="logoutBtn" data-i18n="logout">Cerrar sesión</button>
        <div class="sede-pill gerente-pill">
          <span class="sede-label" data-i18n="role">Rol</span>
          <span class="sede-value" data-i18n="roleGerente">Gerente de Sede</span>
        </div>
      </div>
    </div>

    <!-- Fila inferior: pestañas de vista -->
    <div class="topbar-sub">
      <nav class="sub-nav" id="subNav">
        <button class="sub-nav-btn is-active" data-view="dashboard"  data-i18n="navDashboard">Dashboard</button>
        <button class="sub-nav-btn"            data-view="productos"  data-i18n="navProductos">Productos</button>
        <button class="sub-nav-btn"            data-view="inventario" data-i18n="navInventario">Inventario</button>
        <button class="sub-nav-btn"            data-view="cajas"      data-i18n="navCajas">Cajas</button>
        <button class="sub-nav-btn"            data-view="ventas"     data-i18n="navVentas">Ventas</button>
      </nav>
      <div class="sync-indicator" id="syncIndicator" title="Estado de conexión a la base de datos">
        <span class="sync-dot"></span>
        <span class="sync-text" data-i18n="syncOk">Datos en vivo</span>
      </div>
    </div>
  </header>

  <!-- ============================================================
       CONTENIDO PRINCIPAL: reconstruido por vista en gerente-script.js
       ============================================================ -->
  <main class="main gerente-main" id="main"></main>

  <!-- ============================================================
       BARRA INFERIOR: fecha, hora, gerente, sucursal
       ============================================================ -->
  <footer class="statusbar">
    <div class="status-item">
      <span class="status-label" data-i18n="date">Fecha</span>
      <span class="status-value" id="statusFecha">—</span>
    </div>
    <div class="status-divider"></div>
    <div class="status-item">
      <span class="status-label" data-i18n="time">Hora</span>
      <span class="status-value" id="statusHora">—</span>
    </div>
    <div class="status-divider"></div>
    <div class="status-item">
      <span class="status-label" data-i18n="manager">Gerente</span>
      <span class="status-value" id="statusGerente">-</span>
    </div>  
    <div class="status-divider"></div>
    <div class="status-item">
      <span class="status-label" data-i18n="branch">Sucursal</span>
      <span class="status-value" id="statusSucursal">Manzanillo</span>
    </div>
    <div class="status-divider"></div>
    <div class="status-item">
      <span class="status-label" data-i18n="session">Sesión</span>
      <span class="status-value status-value--ok" id="statusSesion">Activa</span>
    </div>
  </footer>

</div>

<!-- ============================================================
     MODAL: alta / edición de producto
     ============================================================ -->
<div class="modal-overlay" id="modalProducto">
  <div class="modal-card modal-card--wide">
    <button class="modal-close" data-close-modal>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
    <div id="modalProductoContent"></div>
  </div>
</div>

<!-- ============================================================
     MODAL: ajuste de stock / existencias
     ============================================================ -->
<div class="modal-overlay" id="modalStock">
  <div class="modal-card modal-card--wide">
    <button class="modal-close" data-close-modal>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
    <div id="modalStockContent"></div>
  </div>
</div>

<!-- ============================================================
     MODAL: alta / edición de caja
     ============================================================ -->
<div class="modal-overlay" id="modalCaja">
  <div class="modal-card">
    <button class="modal-close" data-close-modal>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
    <div id="modalCajaContent"></div>
  </div>
</div>

<!-- ============================================================
     MODAL: detalle de venta
     ============================================================ -->
<div class="modal-overlay" id="modalVenta">
  <div class="modal-card modal-card--wide">
    <button class="modal-close" data-close-modal>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
    <div id="modalVentaContent"></div>
  </div>
</div>

<!-- Región de toasts -->
<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script src="../JavaScript/dashboard/gerente-script.js?v=2"></script>
</body>
</html>
