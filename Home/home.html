<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karma - Los más vendidos</title>
    <!-- Tipografía del sistema KARMA (la misma del Panel de Administrador) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/home/style.css">
</head>

<body>
    <!-- Aquí se cargará la navbar dinámicamente -->
    <div id="navbar-placeholder"></div>

    <!-- =====================================================
         CONTENIDO PRINCIPAL
         ===================================================== -->
    <main>
        <div class="main-content">
            <h1 class="main-title" data-i18n="top_sellers">Los más vendidos</h1>

            <!-- SECCIÓN 1: LOS 3 MÁS POPULARES (GIRATORIOS) -->
            <div class="product-grid top-sellers" id="top-sellers-container">
               <!-- Las tarjetas se inyectarán aquí mediante JavaScript -->
            </div>

            <!-- TÍTULO SEPARADOR -->
            <h2 class="section-subtitle" data-i18n="catalog">Catálogo completo</h2>

            <!-- SECCIÓN 2: 1 POR LÍNEA (LIQUID Glass PURO) -->
            <div class="product-grid single-column" id="catalog-container">
               <!-- Las tarjetas se inyectarán aquí mediante JavaScript -->
            </div>
        </div>
    </main>
    
    <!-- Aquí se cargará el footer dinámicamente -->
    <div id="footer-placeholder"></div>

    <!-- SCRIPT PRINCIPAL QUE CARGA TODO -->
    <script src="../JavaScript/home/main.js?v=2"></script>
